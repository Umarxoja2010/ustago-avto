<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet aloqasi yo'q — UstaGo Avto</title>
    <meta name="theme-color" content="#15803d" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #071a32;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 32px 24px;
        backdrop-filter: blur(10px);
      }
      .icon-box {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: rgba(22, 163, 74, 0.15);
        border: 1px solid rgba(22, 163, 74, 0.3);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .icon-box svg {
        width: 40px;
        height: 40px;
        stroke: #22c55e;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 10px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        background: #16a34a;
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 20px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #15803d;
      }
      .brand {
        margin-top: 24px;
        font-size: 12px;
        color: #64748b;
        font-weight: 600;
      }
      .brand span {
        color: #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Internet aloqasi yo'q</h1>
      <p>
        Qurilmangiz tarmoqqa ulanmaganga o'xshaydi. Iltimos, Wi-Fi yoki mobil internetni tekshirib
        qaytadan urinib ko'ring.
      </p>
      <button class="btn" onclick="window.location.reload()">Qaytadan urinish</button>
      <div class="brand">UstaGo <span>Avto</span> — Ishonchli Avtoservis</div>
    </div>
  </body>
</html>
